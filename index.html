<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Escolar Universitario</title>
    <style>
        /* Eliminamos los márgenes por defecto del navegador y forzamos el 100% */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Elimina barras de scroll externas dobles */
            background-color: #f3f4f6; /* Color gris claro de fondo idéntico a Tailwind */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Forzamos al contenedor de Google a devorarse toda la pantalla de extremo a extremo */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Contenedor transparente que carga la Web App de Google Apps Script con máxima seguridad -->
    <!-- REEMPLAZA EL VALOR DE 'src' CON TU NUEVA URL DE IMPLEMENTACIÓN DE ACUMULADO DE APPS SCRIPT -->
    <iframe src="https://script.google.com/macros/s/TU_URL_DE_APPS_SCRIPT_AQUI/exec"></iframe>

</body>
</html>
